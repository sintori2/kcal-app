<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 끼 칼로리</title>
<meta name="theme-color" content="#FF8A5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #FFF8F3; --card: #FFFFFF; --text: #2A211C; --sub: #8A7A70; --line: #F0E4DB;
  --accent: #FF8A5B; --accent-soft: #FFE6DA; --good: #4CAF50; --warn: #E5533D;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1715; --card: #26201D; --text: #F4ECE6; --sub: #A8968A; --line: #3A312C;
    --accent: #FF9B70; --accent-soft: #4A2E22; --good: #6CC070; --warn: #FF7A66;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1715; --card: #26201D; --text: #F4ECE6; --sub: #A8968A; --line: #3A312C;
  --accent: #FF9B70; --accent-soft: #4A2E22; --good: #6CC070; --warn: #FF7A66;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; font-size: 16px;
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; width: 100%; }
.hidden { display: none !important; }

header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 8px; }
header h1 { font-size: 20px; margin: 0; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; font-size: 20px; }
.icon-btn:active { background: var(--accent-soft); }

.card { background: var(--card); border-radius: 18px; padding: 16px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.datebar { display: flex; align-items: center; justify-content: space-between; }
.datebar strong { font-size: 17px; }
.total { margin-top: 12px; display: flex; align-items: baseline; gap: 6px; }
.total .num { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
.total .goal { color: var(--sub); }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.over > div { background: var(--warn); }
.remain { color: var(--sub); font-size: 14px; margin-top: 6px; }

.actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
.btn { border-radius: 14px; padding: 14px 10px; font-weight: 700; background: var(--card); border: 1px solid var(--line); }
.btn.primary { background: var(--accent); color: #fff; border: 0; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; }

.meal h3 { font-size: 15px; margin: 0 0 8px; color: var(--sub); display: flex; justify-content: space-between; }
.entry { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.entry:first-of-type { border-top: 0; }
.entry img, .entry .noimg { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex: none; background: var(--accent-soft);
  display: grid; place-items: center; font-size: 22px; }
.entry .info { flex: 1; min-width: 0; }
.entry .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .meta { color: var(--sub); font-size: 13px; }
.entry .kcal { font-weight: 800; }
.empty { color: var(--sub); text-align: center; padding: 18px 0; }

.week { display: flex; align-items: flex-end; gap: 6px; height: 110px; margin-top: 8px; }
.week .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.week .b { width: 100%; max-width: 28px; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 2px; }
.week .b.over { background: var(--warn); }
.week .b.today { outline: 2px solid var(--text); outline-offset: 1px; }
.week small { color: var(--sub); font-size: 11px; }

/* 아래에서 올라오는 시트 */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.sheet h2 { margin: 0 0 12px; font-size: 18px; }
.preview { width: 100%; max-height: 260px; object-fit: cover; border-radius: 14px; background: var(--accent-soft); }
.field { margin: 12px 0; }
.field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
.items .item { margin-bottom: 10px; position: relative; }
.items .row { display: grid; grid-template-columns: 1.2fr 1fr 64px 28px; gap: 6px; }
.items .row input { padding: 8px; }
.items .del { color: var(--warn); font-size: 18px; }
.items .src { font-size: 12px; color: var(--sub); margin: 4px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-weight: 700; font-size: 11px; background: var(--line); color: var(--text); }
.tag.t-식약처 { background: #DCEFDD; color: #24692A; }
.tag.t-웹검색 { background: #DCE8F7; color: #1F4F8A; }
.tag.t-AI추정 { background: #FBE9CF; color: #8A5A12; }
.suggest { position: absolute; left: 0; right: 0; top: 42px; z-index: 5; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.15); overflow: hidden; }
.suggest button { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 10px 12px; text-align: left; border-top: 1px solid var(--line); font-size: 14px; }
.suggest button:first-child { border-top: 0; }
.suggest button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest button b { flex: none; color: var(--sub); font-weight: 600; }
.weight-card { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 2px 12px; width: 100%; text-align: left; }
.weight-card .wlabel { font-weight: 700; color: var(--sub); }
.weight-card .wnum { text-align: right; }
.weight-card .wnum b { font-size: 26px; }
.weight-card .small { grid-column: 1 / -1; }
.scale-num { text-align: center; margin: 8px 0 0; color: var(--sub); }
.scale-num b { font-size: 56px; color: var(--text); letter-spacing: -1px; }
.wrow { display: grid; grid-template-columns: 1fr auto auto 28px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.wrow:first-child { border-top: 0; }
.wrow small { color: var(--sub); }
.wrow .del { color: var(--warn); }
.switch { display: flex; align-items: center; gap: 10px; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }
.sum { display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; margin: 10px 0; }
.note { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
.row-btns { display: flex; gap: 8px; margin-top: 14px; }
.row-btns .btn { flex: 1; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { padding: 9px 0; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; }
.seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.spinner { width: 34px; height: 34px; border: 4px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.9s linear infinite; margin: 18px auto 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.center { text-align: center; color: var(--sub); }
.small { font-size: 13px; color: var(--sub); }
.danger { color: var(--warn); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 20; }
</style>
</head>
<body>
<header>
  <h1>🍽️ 한 끼 칼로리</h1>
  <button class="icon-btn" id="openSettings" aria-label="설정">⚙️</button>
</header>

<section class="card">
  <div class="datebar">
    <button class="icon-btn" id="prevDay" aria-label="전날">◀</button>
    <strong id="dateLabel"></strong>
    <button class="icon-btn" id="nextDay" aria-label="다음날">▶</button>
  </div>
  <div class="total"><span class="num" id="totalNum">0</span><span class="goal" id="goalLabel">/ 2000 kcal</span></div>
  <div class="bar" id="bar"><div id="barFill" style="width:0"></div></div>
  <div class="remain" id="remain"></div>
</section>

<button class="card weight-card" id="weightCard">
  <span class="wlabel">⚖️ 체중</span>
  <span class="wnum"><b id="weightNum">–</b> kg</span>
  <span class="small" id="weightMeta"></span>
</button>

<div class="actions">
  <button class="btn primary" id="camBtn">📷 사진 찍기</button>
  <button class="btn" id="galBtn">🖼️ 앨범</button>
  <button class="btn" id="manualBtn">✏️ 직접</button>
</div>
<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="galInput" accept="image/*" class="hidden">

<div id="meals"></div>

<section class="card">
  <h3 style="margin:0;font-size:15px;color:var(--sub)">최근 7일</h3>
  <div class="week" id="week"></div>
</section>

<!-- 기록 추가·수정 시트 -->
<div class="sheet-bg hidden" id="entrySheet">
  <div class="sheet">
    <h2 id="entryTitle">음식 기록</h2>
    <img class="preview hidden" id="entryImg" alt="음식 사진">
    <div class="field" id="hintField">
      <label>사진에 덧붙일 말 (선택)</label>
      <input id="hintInput" placeholder="예: 밥은 반 공기만 먹었어요">
    </div>
    <div id="analyzing" class="hidden"><div class="spinner"></div><p class="center" id="analyzeMsg">사진을 보고 있어요…</p></div>
    <div id="entryForm">
      <div class="field">
        <label>끼니</label>
        <div class="seg" id="mealSeg"></div>
      </div>
      <div class="field items">
        <label>음식 · 양 · kcal</label>
        <div id="itemRows"></div>
        <button class="btn" id="addItem" style="width:100%;padding:10px">+ 음식 추가</button>
      </div>
      <div class="sum"><span>합계</span><span id="entrySum">0 kcal</span></div>
      <div class="note hidden" id="aiNote"></div>
    </div>
    <div class="row-btns">
      <button class="btn hidden" id="deleteEntry"><span class="danger">삭제</span></button>
      <button class="btn" id="cancelEntry">취소</button>
      <button class="btn primary" id="analyzeBtn">분석하기</button>
      <button class="btn primary" id="saveEntry">저장</button>
    </div>
  </div>
</div>

<!-- 체중 시트 -->
<div class="sheet-bg hidden" id="weightSheet">
  <div class="sheet">
    <h2>체중 재기</h2>
    <div class="scale-num"><b id="scaleNum">–</b> kg</div>
    <p class="center" id="scaleMsg"></p>
    <button class="btn primary" id="scaleConnect" style="width:100%">🔗 체중계 연결</button>
    <div class="field">
      <label>저장할 체중 (직접 입력도 돼요)</label>
      <input id="weightManual" type="number" inputmode="decimal" step="0.05" min="10" placeholder="예: 70.5">
    </div>
    <div class="row-btns">
      <button class="btn" id="weightClose">닫기</button>
      <button class="btn primary" id="weightSave" disabled>저장</button>
    </div>
    <div class="field">
      <label>최근 기록</label>
      <div id="weightList"></div>
    </div>
  </div>
</div>

<!-- 설정 시트 -->
<div class="sheet-bg hidden" id="settingsSheet">
  <div class="sheet">
    <h2>설정</h2>
    <div class="field">
      <label>하루 목표 칼로리</label>
      <input id="goalInput" type="number" inputmode="numeric" min="500" step="50">
    </div>
    <div class="field">
      <label>Claude API 키 (이 폰에만 저장돼요)</label>
      <input id="keyInput" type="password" autocomplete="off" placeholder="sk-ant-...">
      <p class="small">console.anthropic.com → API Keys에서 만들 수 있어요. 사진 분석 때만 쓰입니다.</p>
    </div>
    <div class="field">
      <label>분석 모델</label>
      <select id="modelInput">
        <option value="claude-opus-5-5">Claude Opus 5.5 — 가장 정확 (기본)</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5 — 중간</option>
        <option value="claude-haiku-5-5">Claude Haiku 5.5 — 가장 저렴</option>
      </select>
    </div>
    <div class="field">
      <label class="switch"><input type="checkbox" id="webInput"> 식약처 데이터에 없는 음식은 인터넷 검색</label>
      <p class="small">켜면 없는 음식만 검색해요. 검색할 때마다 요금이 조금 더 나가요.</p>
    </div>
    <div class="field">
      <label>체중계</label>
      <a class="btn" href="bt.html" style="display:block;text-align:center;text-decoration:none">⚖️ 체중계 연결 시험</a>
    </div>
    <div class="field">
      <label>백업</label>
      <div class="row-btns" style="margin-top:0">
        <button class="btn" id="exportBtn">내보내기</button>
        <button class="btn" id="importBtn">불러오기</button>
      </div>
      <input type="file" id="importInput" accept="application/json" class="hidden">
    </div>
    <div class="row-btns">
      <button class="btn primary" id="closeSettings">저장하고 닫기</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
