<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 AI 인식 확인</title>
<style>
:root { --bg: #FFF8F3; --card: #fff; --text: #2A211C; --sub: #8A7A70; --line: #F0E4DB; --ok: #2E7D32; --okbg: #DCEFDD; --no: #C62828; --nobg: #FBE1DF; --accent: #FF8A5B; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1B1715; --card: #26201D; --text: #F4ECE6; --sub: #A8968A; --line: #3A312C; --ok: #8BD48F; --okbg: #1F3A22; --no: #FF8A80; --nobg: #45201D; --accent: #FF9B70; }
}
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 720px; padding: 16px; background: var(--bg); color: var(--text); font-family: system-ui, "Malgun Gothic", sans-serif; }
h1 { font-size: 20px; margin: 8px 0; }
.help { color: var(--sub); font-size: 14px; line-height: 1.6; }
.card { background: var(--card); border-radius: 16px; padding: 12px; margin: 14px 0; }
.card img { width: 100%; border-radius: 10px; display: block; }
.head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
.head b { font-size: 16px; }
.head small { color: var(--sub); font-size: 12px; text-align: right; }
.items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.it { border: 1.5px solid var(--line); border-radius: 99px; padding: 7px 12px; font-size: 14px; cursor: pointer; background: none; color: var(--text); }
.it.ok { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
.it.no { background: var(--nobg); border-color: var(--no); color: var(--no); text-decoration: line-through; }
.miss { width: 100%; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }
.meta { font-size: 12px; color: var(--sub); margin-top: 6px; }
.meta a { color: var(--sub); }
.bar { position: sticky; bottom: 10px; display: flex; gap: 8px; }
.bar button { flex: 1; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
#score { text-align: center; color: var(--sub); font-size: 14px; margin: 6px 0; }
</style>
</head>
<body>
<h1>내 AI 인식 확인</h1>
<p class="help">사진마다 AI가 찾은 음식에 번호 상자를 그렸어요. 음식 버튼을 눌러 <b style="color:var(--ok)">맞음</b> → <b style="color:var(--no)">틀림</b> → 미확인 순으로 바꿔 주세요.
놓친 음식은 아래 칸에 적어 주세요. 다 하면 <b>결과 복사</b>를 눌러 Claude에게 붙여 넣으면 돼요.</p>
<div id="list"></div>
<p id="score"></p>
<div class="bar"><button id="copy">📋 결과 복사</button></div>
<script>
const DATA = /*DATA*/[];
const state = DATA.map((c) => ({ marks: c.items.map(() => 0), miss: '' }));
function score() {
  let ok = 0, no = 0;
  state.forEach((s) => s.marks.forEach((m) => { if (m === 1) ok++; if (m === 2) no++; }));
  document.getElementById('score').textContent = `맞음 ${ok} · 틀림 ${no}`;
}
const list = document.getElementById('list');
DATA.forEach((c, ci) => {
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `<div class="head"><b>#${c.n} ${c.multi ? '여러 음식' : '한 음식'}</b><small></small></div>
    <img alt="음식 사진 ${c.n}" src="data:image/jpeg;base64,${c.img}"><div class="items"></div>
    <input class="miss" placeholder="놓친 음식 (예: 계란찜, 김치)"><div class="meta"></div>`;
  card.querySelector('small').textContent = `사진 전체로 보면: ${c.whole.slice(0, 2).join(', ')}`;
  const meta = card.querySelector('.meta');
  meta.textContent = `${c.title} `;
  if (c.page) { const a = document.createElement('a'); a.href = c.page; a.target = '_blank'; a.textContent = `출처 (${c.license || '위키미디어'})`; meta.appendChild(a); }
  const box = card.querySelector('.items');
  c.items.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'it';
    b.textContent = `${c.multi ? (i + 1) + '. ' : ''}${it.name} ${it.p}%${it.pre ? '' : ' (자동 제외)'}`;
    b.onclick = () => {
      state[ci].marks[i] = (state[ci].marks[i] + 1) % 3;
      b.className = 'it' + ['', ' ok', ' no'][state[ci].marks[i]];
      score();
    };
    box.appendChild(b);
  });
  card.querySelector('.miss').oninput = (e) => { state[ci].miss = e.target.value; };
  list.appendChild(card);
});
score();
document.getElementById('copy').onclick = async () => {
  const lines = DATA.map((c, ci) => {
    const s = state[ci];
    const part = c.items.map((it, i) => `${it.name}${['?', 'O', 'X'][s.marks[i]]}`).join(' ');
    return `#${c.n} ${part}${s.miss ? ` / 놓침: ${s.miss}` : ''}`;
  });
  const text = `[인식 확인 결과]\n${lines.join('\n')}`;
  try { await navigator.clipboard.writeText(text); alert('복사했어요. Claude에게 붙여 넣어 주세요.'); }
  catch { prompt('아래 내용을 복사해 주세요', text); }
};
</script>
</body>
</html>
